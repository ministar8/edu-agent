<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>408 智能辅导</title>
  <link rel="stylesheet" href="/style.css">
  <!-- 必须在 head 里同步加载：主题要在首次绘制前生效，否则会闪一下浅色 -->
  <script src="/theme.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">EduAgent</div>

      <button class="new-thread" id="new-thread"><span class="plus">＋</span>新建会话</button>
      <div class="thread-list" id="thread-list"></div>

      <nav class="nav-group">
        <button class="nav-item active" data-view="chat">智能问答</button>
      </nav>

      <div class="user-card">
        <div class="user-avatar" id="user-avatar">·</div>
        <div class="user-meta">
          <div class="name" id="user-name"></div>
          <div class="role" id="user-role"></div>
        </div>
      </div>
      <div class="side-actions">
        <button class="logout" id="logout">退出登录</button>
        <button class="theme-toggle" id="theme-toggle">深色</button>
      </div>
    </aside>
    <main class="main">
      <div class="main-header" id="view-title">智能问答</div>

      <section class="view active" id="view-chat">
        <div class="messages" id="messages">
          <div class="empty-hint">
            <h2>408 考研智能辅导</h2>
            <p>提问知识点、让我出题、或提交答案批改</p>
            <div class="cta"><button class="btn-primary" id="start-btn">开始提问</button></div>
          </div>
        </div>
        <form class="input-bar" id="chat-form">
          <input id="chat-input" placeholder="输入你的问题…" autocomplete="off">
          <button type="submit" class="send-btn" id="send-btn">发送</button>
        </form>
      </section>
    </main>
  </div>
  <script src="/api.js"></script>
  <script src="/app.js"></script>
</body>
</html>
