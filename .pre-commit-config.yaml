# 提交前门禁。本工作区无 CI，这是**唯一的自动强制**环节。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        # knowledge/ 是 RAG 语料（内容，不是代码），空白规范不适用它：
        # 改这些文件会让磁盘内容与已入库的向量索引不同步，
        # 而收益只是清掉几个行尾空格 —— 不划算，故排除。
        # ★ evals/ 同理（见文件末尾说明性钩子）：它是门禁基线的输入。
        exclude: ^(knowledge|evals)/
      - id: trailing-whitespace
        # 保留 Markdown 的「行尾两个空格 = 硬换行」语义，
        # 否则正文里的强制换行会被静默吃掉（渲染结果变化）。
        args: [--markdown-linebreak-ext=md]
        exclude: ^(knowledge|evals)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        # 范围是 `src/`：本工作区不含 `tests/`，带上它会报 E902（不是代码问题）；
        # `scripts/` 只有 tei_deploy.ps1，非 Python。
        args: [--fix, src/]
      - id: ruff-format
        args: [src/]

  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        # 用 `uv run` 而非硬编码 venv 绝对路径 —— 绝对路径与机器绑定，别人 clone 必崩。
        # ★ 相对路径（`.venv/Scripts/pyrefly.exe`）在 pre-commit 下会失败
        #   （system hook 的 cwd 不是仓库根，实测 [WinError 2]），但从终端手动跑却正常 ——
        #   这是 pre-commit 执行机制造成的差异，别误判成「pyrefly 坏了」。
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        # pyrefly 只查 Python；无 Python 变更时跳过，省一次全量检查
        types: [python]

  - repo: local
    hooks:
      # `evals/` 下 4 个文件（3 份门禁基线 + 1 份评测集）是门禁**精确比对的输入**
      # （`retrieval_gate` 逐指标比基线值）。让空白类钩子改写它们有双重害处：
      # ① 可能破坏基线可解析性；② 在 diff 里混入无意义噪声、掩盖真实改动。
      # ★ 豁免的**实现**是上面 end-of-file-fixer / trailing-whitespace 的
      # `exclude: ^(knowledge|evals)/` —— 本钩子只负责在被 `evals/` 触发时
      # 打印一行说明，**它本身不构成任何拦截**（曾经误以为「声明即豁免」，
      # 实测钩子照改不误、只是改了行尾换行，故补上真正的 exclude）。
      - id: evals-baselines-excluded
        name: evals/ 基线豁免空白改写（说明性钩子）
        entry: bash -c 'echo "[pre-commit] evals/ 是门禁基线输入，已由 exclude 跳过空白类改写" >&2'
        language: system
        files: ^evals/
