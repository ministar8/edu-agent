coverage:
  status:
    # 总覆盖率下降超过 2% 时让 PR 检查失败
    project:
      default:
        target: auto
        threshold: 2%
    # 增量覆盖率（patch）**阻塞** PR：新代码必须自带测试。
    #
    # 为什么必须阻塞（实测量化）：project 门禁是"总覆盖率降幅 >2% 才拦"。
    # 按当时 8876 语句 / 57% 覆盖计算，**一次 PR 可以加约 340 条未测语句仍然通过** ——
    # 也就是说**新代码可以完全没测试**，只要不把总数拉低 2%。
    # 总覆盖率是存量指标，天然无法约束增量；这正是 patch 门禁存在的意义。
    patch:
      default:
        informational: false
        target: 80%
  ignore:
    - "tests/"
    # 离线数据清洗工具。★ 原写「不参与运行时」不准确：clean_documents() 会调用
    # tools.imputer / tools.anomaly，它们在入库链里。排除的真正依据是
    # 「门禁 build_index() 跑真实入库链时会一并执行它们」（pytest 侧实测 0% 覆盖，
    # 因为门禁跑在独立进程）。守卫见 tests/rag/test_cleaner.py::TestIngestionChainReachesTools
    - "src/tools/"

comment:
  hide_project_coverage: false
