[project]
name = "edu-agent"
version = "0.1.0"
description = "408 考研智能教学辅导多 Agent 系统"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi ~=0.139.0",
    "uvicorn[standard] ~=0.51.0",
    "pydantic ~=2.13.4",
    "pydantic-settings ~=2.14.2",
    "python-dotenv ~=1.2.2",
    "httpx ~=0.28.1",
    "httpx-sse ~=0.4.3",
    "langchain ~=1.3.11",
    "langchain-core ~=1.4.8",
    "langchain-openai ~=1.3.3",
    "langchain-community ~=0.4.2",
    "langchain-chroma ~=1.1.0",
    "langgraph ~=1.2.7",
    "langgraph-supervisor ~=0.0.31",
    "langgraph-checkpoint-sqlite ~=3.1.0",
    "chromadb >=1.5.0,<2.0.0",
    "jieba ==0.42.1",
    "opencc-python-reimplemented ~=0.1.7",
    "pymupdf4llm >=0.1.5,<2.0.0",
    "pypdf >=6.0.0,<7.0.0",
    "PyJWT ==2.10.1",
    "sqlalchemy >=2.0.0,<3.0.0",
    "python-multipart ==0.0.26",
    "datasketch ~=1.6.5",
    "chardet ==5.2.0",
    "langsmith ~=0.12.2",
]

[dependency-groups]
eval = [
    "ragas>=0.4.0",
    "datasets>=3.0.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-env",
    "ruff ~=0.15.21",
    "pyrefly ~=1.1.1",
    "pre-commit",
    "langgraph-cli[inmem]",
    "pymarkdownlnt",
    "playwright>=1.55",
    # 把每条失败用例的断言消息输出成 GitHub 注解（::failure::），
    # 于是失败详情会出现在**公开的 check-run annotations API** 里 ——
    # 无需认证即可读取（Actions 日志与 artifact 都要认证）。
    # 只在 GITHUB_ACTIONS 环境变量存在时生效，本地跑是静默 no-op。
    #
    # **实测价值**：靠它才定位到 `core/cache.py` 的淘汰 off-by-one ——
    # 在此之前「读不到日志」导致我基于间接线索误判成 E2E 的时序问题，
    # 白走了很长的弯路。失败注解里直接写着
    # `TestConcurrency.test_set_under_contention_stays_bounded / assert 5 <= 4`。
    "pytest-github-actions-annotate-failures>=0.4.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "U", "S110", "C90"]
# S110 = try/except/pass。**只标"宽泛捕获 + 静默"**（`except Exception: pass`），
# 不标 `except json.JSONDecodeError: pass` 这类具体异常的降级路径 ——
# 前者会让故障无声消失，后者是有意设计的 fallback 链。
# 确属有意忽略的，用 `# noqa: S110 — <理由>` 显式标注。
#
# C90 = mccabe 圈复杂度。阈值见下方 [tool.ruff.lint.mccabe]。

[tool.ruff.lint.mccabe]
# **阈值 30 就是「当前最复杂函数」的复杂度，所以开启时命中 0 处。**
#
# 这是刻意的**棘轮**设计：门禁的目的是**阻止新增债务**，而不是逼人还清旧债
# （见 ENGINEERING.md §3.4 的门禁设计原则）。当前最复杂的三个函数：
#   `_semantic_segment` (30) · `_chroma_window_expand` (26) · `message_generator` (26)
# 设成 30 的含义是「不许再写出比今天最复杂的那个还复杂的函数」——
# 新代码一超标就被拦，既有代码一处不动。
#
# **为什么不直接设常见的 15**：那样会一次命中 11 处既有代码，门禁立刻变红，
# 结果要么被加 noqa 绕过、要么被关掉 —— 反而失去了意义。
# 想收紧应当**配合重构逐步下调**：先把上面三个降到 25 以下，再把阈值降到 25，以此类推。
max-complexity = 30

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.pytest_env]
# 测试环境：默认走假模型，另给一个假 provider key 以便构造真实模型实例（不联网）
USE_FAKE_MODEL = "true"
DASHSCOPE_API_KEY = "sk-fake-dashscope-key"
JWT_SECRET = "test-secret-key"
# 单测不依赖 TEI embedding：默认走确定性哈希向量
USE_FAKE_EMBEDDING = "true"
# 长期记忆的 Store 向量索引同样不依赖 TEI
MEMORY_STORE_VECTOR_ENABLED = "false"

[tool.pymarkdown]
# 文档使用长段落而非固定列宽硬换行，故不强制行宽
plugins.md013.enabled = false
# README.md 中有意使用内联 HTML（如带 width 的 <img>）
plugins.md033.enabled = false
# 并非每篇文档都需要以一级标题开头
plugins.md041.enabled = false
# 允许重复标题文本，只要不是相邻兄弟节点
plugins.md024.siblings_only = true

[tool.pyrefly]
project-includes = ["src"]
preset = "default"

[tool.pyrefly.errors]
# LangGraph 的 StateGraph(state_schema) 泛型对 MessagesState 子类的误报，非真实错误
bad-specialization = false

# 迁移自旧 backend 的 RAG 检索链类型注解尚不严格，暂放宽（技术债，后续逐步收紧）
#
# **`unbound-name` 与 `missing-import` 已开启**（backlog #12）：
# - `unbound-name` 查出 `semantic_cache.py` 两处「错误处理路径引用未绑定的 `mgr`」——
#   `get_vector_store_manager()` 抛异常时，except 里的 `mgr.client...` 会抛
#   UnboundLocalError **掩盖原始异常**。已修（提前绑定 + 显式处理拿不到的情况）。
# - `missing-import` 此前**在 `src/evaluation/**` 一直是开着的**，报 5 个
#   `ragas`/`datasets` 未找到 —— 它们是可选的 `eval` 依赖组，CI 不装。
#   已在 6 处可选导入上显式标注 `# type: ignore[import-not-found]`，
#   让检查得以开启：它能抓**模块名拼写错误**（只在运行时才炸的那类）。
[[tool.pyrefly.sub-config]]
matches = "src/rag/**"
errors = { bad-argument-type = false, missing-attribute = false, not-iterable = false, bad-assignment = false, bad-return = false, not-callable = false, bad-unpacking = false }

# 迁移自旧 backend 的数据清洗工具同样类型注解不严格
# （`unbound-name` 也已开启：查出 `imputer.py` 里 `tokenizer = jieba` 之后
#   却用 `jieba.cut()` —— 运行时靠 `if tokenizer:` 间接守着，属脆弱写法，已改）
[[tool.pyrefly.sub-config]]
matches = "src/tools/**"
errors = { bad-argument-type = false, missing-attribute = false, not-iterable = false, bad-assignment = false, bad-return = false, not-callable = false, bad-unpacking = false, unsupported-operation = false }
