name: CI

# 毕设「够用」版 CI：只做四件事 ——
#   1) lint / 类型检查（通用工程规范）
#   2) 单元测试（纯本地 I/O，无网络无密钥：口径类判据别只写在文档里）
#   3) 检索质量门禁（与论文主题直接相关：每次 push 重跑黄金集、比对**默认路由**的 1 份基线）
#   4) 基线重录登记的机械核对（零 token、纯 stdlib：把「禁止静默重录」从纪律变成判据）
# 刻意不做：RAGAS（要真 key + 花钱 + 随机）、probe_gate（基线是 real embedding 口径，
# 需真 TEI）、真实 TEI 路由（要 GPU）、覆盖率统计（套件刚恢复，覆盖面只有遥测采样这几例，
# 报出来的百分比只会误导）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # 答辩时可手动触发一次，当场展示门禁结果

jobs:
  lint:
    name: lint / 类型检查 / 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true # 缓存 uv 下载与 venv，二次运行快很多
      # 默认包含 dev 组（ruff / pyrefly / pytest 都在里面）
      - run: uv sync --frozen
      - run: uv run ruff check src/ tests/
      # ★ check 与 format 是两条独立命令，必须分别跑（只跑一条会漏）
      - run: uv run ruff format --check src/ tests/
      - run: uv run pyrefly check
      # 口径类判据（遥测采样：错误记录不削、留痕自带倍率）由 [tool.pytest_env] 供假环境，
      # 不联网、不建索引。★ 进 CI 的理由与核对脚本同一条：不跑的验证等于没有验证。
      - run: uv run pytest -q

  retrieval-gate:
    name: 检索质量门禁（假 embedding 路由）
    runs-on: ubuntu-latest
    # 该路由用确定性哈希 embedding：不依赖 TEI、不联网、不需要真密钥。
    # 这几个变量与 pyproject 的 [tool.pytest_env] 同口径。
    env:
      USE_FAKE_MODEL: "true"
      USE_FAKE_EMBEDDING: "true"
      MEMORY_STORE_VECTOR_ENABLED: "false"
      DASHSCOPE_API_KEY: "sk-fake-dashscope-key" # 仅为构造模型实例，不发请求
      JWT_SECRET: "test-secret-key"
      PYTHONPATH: src
      PYTHONUTF8: "1" # 避免 GBK 环境下的中文日志乱码
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # 门禁只依赖运行时依赖（不 import ragas），故排除 dev 组保持精简
      - run: uv sync --frozen --no-dev
      # 156 条黄金集 × 9 指标，比 retrieval_baseline.json；任一指标跌破即退出码 1
      - run: uv run python -m evaluation.gates.retrieval_gate

  baseline-registration:
    name: 基线重录登记核对（零 token）
    runs-on: ubuntu-latest
    # 核对脚本只用 stdlib（argparse/json/re/pathlib），所以不装依赖、不建 venv。
    # 判据是双向穷尽：登记表里写的每个 diff 都要能在工件里核到，且工件里每个非零 diff
    # 都必须已登记 —— 「禁止静默重录」从此不靠自觉。
    # ★ 为什么要进 CI：`8e2add6`（2026-10-10）重录 6 份基线却一行登记都没改，而该脚本
    #   按当时设计「是验证工具、不进 evidence_chain_gate、不进 CI」，于是 §20.7.1 连续
    #   红 3 天无人跑过、无人看见。零成本的东西没理由留在人肉环节。
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ops/check_baseline_diff_registration.py
