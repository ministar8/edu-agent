name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check --output-format github src/ tests/ scripts/
      - name: Format check
        run: uv run ruff format --check src/ tests/ scripts/
      - name: Type check
        run: uv run pyrefly check
      # 前端冒烟测试（backlog #19）需要真实浏览器。
      # 缓存二进制，否则每次 CI 都要重下 ~150MB（chromium + headless shell）。
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium chromium-headless-shell
      - name: Test
        run: uv run pytest --cov=src/ --cov-report=xml --cov-report=json
      # 失败时把 E2E 的诊断产物传上去：截图 + 子进程服务日志。
      # 没有这一步，断言消息里那句「截图: _e2e_artifacts/ask.png」在 CI 里毫无用处
      # （路径在临时 runner 上，跑完就没了）—— 排查 flaky 时只能靠猜。
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-py${{ matrix.python-version }}
          path: _e2e_artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Per-module coverage gate
        run: uv run python scripts/check_coverage_by_module.py
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint markdown with pymarkdown
        # docs/ 目前在 .gitignore 中（clone 后不存在），故暂不纳入扫描
        run: uv run pymarkdown scan README.md

  pre-commit:
    # 空白 / YAML 卫生：check-yaml、end-of-file-fixer、trailing-whitespace。
    # 这三项此前**没有任何 CI 覆盖** —— 本地也没装 git 钩子（没跑过 pre-commit install），
    # 所以 .pre-commit-config.yaml 一直是摆设，仓库里长期存在行尾空格与缺失的文件尾换行。
    #
    # SKIP 跳过 ruff / ruff-format / pyrefly：它们已在 test-python 里单独跑，
    # 且那边的 `--output-format github` 能产出 PR 内联注解，比 pre-commit 的输出更好用。
    # 用 SKIP 而不是逐个指定钩子 id，是为了让**将来新增的钩子自动纳入 CI**。
    #
    # 注意 `knowledge/` 已在配置里排除：它是 RAG 语料（内容而非代码），
    # 改它会让磁盘内容与已入库的向量索引不同步。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      # 缓存钩子仓库，否则每次都要重新 clone pre-commit-hooks / ruff-pre-commit
      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit hooks
        env:
          SKIP: ruff,ruff-format,pyrefly
        run: uv run pre-commit run --all-files

  retrieval-quality-gate:
    # 检索质量回归门禁：固定黄金集 + 固定指标，退化即失败。
    # 刻意不依赖 TEI / Chroma 外部服务（用确定性哈希 embedding + 临时索引），
    # 因此它衡量的是**检索管线**（路由/融合/阈值/去重）是否退化，不是语义质量。
    # 语义质量由 evals 的 RAGAS 离线评测负责。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run retrieval quality gate
        env:
          PYTHONPATH: src
          # 必须显式开启：CI 里没有 .env，settings 会因"未配置任何 LLM 网关"直接抛错；
          # 且检索链的 decompose / HyDE 会调 LLM，无凭据时会抛 Missing credentials
          # （实测 40 条 query 里 6 条崩溃）。configure_for_gate 也会再设一次，
          # 这里是防止 settings 构造阶段就先失败。
          USE_FAKE_MODEL: "true"
        run: uv run python -m evaluation.retrieval_gate

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build service image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: edu-agent.service:${{ github.sha }}
          file: docker/Dockerfile.service

      - name: Start service container
        run: |
          docker run -d --name service-container --network host \
            -e USE_FAKE_MODEL=true -e PORT=80 \
            edu-agent.service:${{ github.sha }}

      - name: Confirm service starts correctly
        run: |
          timeout 30 bash -c '
            while ! curl -s http://0.0.0.0/health; do
              echo "Waiting for service to be ready..."
              docker logs service-container
              sleep 2
            done
          '

      - name: Clean up containers
        if: always()
        run: |
          docker stop service-container || true
          docker rm service-container || true
