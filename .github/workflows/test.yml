name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check --output-format github src/ tests/ scripts/
      - name: Format check
        run: uv run ruff format --check src/ tests/ scripts/
      - name: Type check
        run: uv run pyrefly check
      - name: Test
        run: uv run pytest --cov=src/ --cov-report=xml --cov-report=json
      - name: Per-module coverage gate
        run: uv run python scripts/check_coverage_by_module.py
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint markdown with pymarkdown
        # docs/ 目前在 .gitignore 中（clone 后不存在），故暂不纳入扫描
        run: uv run pymarkdown scan README.md

  retrieval-quality-gate:
    # 检索质量回归门禁：固定黄金集 + 固定指标，退化即失败。
    # 刻意不依赖 TEI / Chroma 外部服务（用确定性哈希 embedding + 临时索引），
    # 因此它衡量的是**检索管线**（路由/融合/阈值/去重）是否退化，不是语义质量。
    # 语义质量由 evals 的 RAGAS 离线评测负责。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run retrieval quality gate
        env:
          PYTHONPATH: src
          # 必须显式开启：CI 里没有 .env，settings 会因"未配置任何 LLM 网关"直接抛错；
          # 且检索链的 decompose / HyDE 会调 LLM，无凭据时会抛 Missing credentials
          # （实测 40 条 query 里 6 条崩溃）。configure_for_gate 也会再设一次，
          # 这里是防止 settings 构造阶段就先失败。
          USE_FAKE_MODEL: "true"
        run: uv run python -m evaluation.retrieval_gate

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build service image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: edu-agent.service:${{ github.sha }}
          file: docker/Dockerfile.service

      - name: Start service container
        run: |
          docker run -d --name service-container --network host \
            -e USE_FAKE_MODEL=true -e PORT=80 \
            edu-agent.service:${{ github.sha }}

      - name: Confirm service starts correctly
        run: |
          timeout 30 bash -c '
            while ! curl -s http://0.0.0.0/health; do
              echo "Waiting for service to be ready..."
              docker logs service-container
              sleep 2
            done
          '

      - name: Clean up containers
        if: always()
        run: |
          docker stop service-container || true
          docker rm service-container || true
