# Dependabot：依赖安全与版本更新
#
# 为什么要有它（见 ENGINEERING.md §3.4 第 5 条「依赖安全扫描」）：
#   `uv.lock` 把版本锁死了，好处是**可复现**，代价是**没人会主动升级** ——
#   锁文件一旦生成就被遗忘，直到某天需要某个新特性或爆出 CVE 才被迫处理，
#   那时往往要跨好几个大版本一起跳。让机器人按周提 PR，把「大跳」拆成「小步」。
#
# 分组（groups）的作用：把同类更新合成**一个** PR，否则一周能刷出十几个 PR，
# 很快就没人看了 —— 没人看的 PR 等于没有。宁可少而可读。

version: 2
updates:
  # ── Python 依赖（uv.lock）──────────────────────────────
  # Dependabot 自 v0.11 起支持 uv 生态；它读的是 uv.lock 而不是 requirements.txt。
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      python-runtime:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # 大版本更新单独开 PR —— 它们可能带破坏性变更，值得单独看
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ────────────────────────────────────
  # workflow 里 pin 的是 tag（如 actions/checkout@v7），tag 会被上游移动，
  # 定期跟进能拿到安全修复与新 runner 支持。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # ── Docker 基础镜像 ────────────────────────────────────
  # docker/Dockerfile.service 基于 python:3.12-slim，基础镜像会持续收安全补丁。
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  # ── pre-commit 钩子 ───────────────────────────────────
  # .pre-commit-config.yaml 里 pin 了 ruff / pre-commit-hooks 的 rev。
  # 这些钩子本身也会更新（尤其 ruff 的规则集），定期跟进避免一次跳太多。
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
